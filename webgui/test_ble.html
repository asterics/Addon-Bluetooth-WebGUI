<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>BLE Communicator Test</title>
  <style>
    body { font-family: Arial, Helvetica, sans-serif; padding: 16px; }
    #log { width: 100%; height: 300px; white-space: pre-wrap; overflow:auto; }
    .row { margin-bottom: 8px; }
  </style>
</head>
<body>
  <h2>BluetoothCommunicator Test</h2>
  <p>Note: Web Bluetooth requires a secure context (HTTPS or localhost). Serve this file from a webserver.</p>

  <div class="row">
    <button id="connectBtn">Connect</button>
    <button id="disconnectBtn" disabled>Disconnect</button>
  </div>

  <div class="row">
    <input id="cmdInput" style="width:70%" placeholder="Enter AT command (e.g. AT+VERSION)?" />
    <button id="sendBtn" disabled>Send</button>
  </div>

  <div class="row">
    <textarea id="log" readonly></textarea>
  </div>

  <script type="module">
    import {BluetoothCommunicator} from './js_new/adapter/blecomm.js';

    const connectBtn = document.getElementById('connectBtn');
    const disconnectBtn = document.getElementById('disconnectBtn');
    const sendBtn = document.getElementById('sendBtn');
    const cmdInput = document.getElementById('cmdInput');
    const logArea = document.getElementById('log');

    const comm = new BluetoothCommunicator();

    function log(msg) {
      const ts = new Date().toLocaleTimeString();
      logArea.value += `[${ts}] ${msg}\n`;
      logArea.scrollTop = logArea.scrollHeight;
    }

    comm.setValueHandler((line) => {
      log('VALUE: ' + line.trim());
    });

    connectBtn.addEventListener('click', async () => {
      try {
        log('Requesting device...');
        await comm.init();
        log('Connected');
        connectBtn.disabled = true;
        disconnectBtn.disabled = false;
        sendBtn.disabled = false;
      } catch (e) {
        log('Connect error: ' + e);
      }
    });

    disconnectBtn.addEventListener('click', async () => {
      try {
        await comm.close();
        log('Disconnected');
      } catch (e) {
        log('Disconnect error: ' + e);
      } finally {
        connectBtn.disabled = false;
        disconnectBtn.disabled = true;
        sendBtn.disabled = true;
      }
    });

    sendBtn.addEventListener('click', async () => {
      const cmd = cmdInput.value.trim();
      if (!cmd) return;
      try {
        log('Sending: ' + cmd);
        // wait up to 2s for a response (if any)
        const res = await comm.sendValue(cmd, 2000);
        if (res) log('Response: ' + res);
      } catch (e) {
        log('Send error: ' + e);
      }
    });

  </script>
</body>
</html>
